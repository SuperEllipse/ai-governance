<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeMo Guardrails Banking Demo</title>
    <script>
      // Apply the saved theme before first paint. Default is light (white), whatever the OS uses.
      try {
        if (localStorage.getItem("guardrails-demo-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
