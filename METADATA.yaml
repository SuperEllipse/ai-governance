maintainer_name: "Vish Rajagopalan"

# --- Dates ---
date_created: "2026-06-21"                   # First commit
date_updated: "2026-11-01"                   # Bump on the commit that ships a change worth cataloguing
published_date: ""                           # Set when it first appears in the catalog
